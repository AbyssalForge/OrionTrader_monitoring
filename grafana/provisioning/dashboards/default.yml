apiVersion: 1

providers:
  - name: 'Audiomancy'
    orgId: 1
    folder: 'Audiomancy'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/audiomancy

  - name: 'OrionTrader'
    orgId: 1
    folder: 'OrionTrader'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/oriontrader
