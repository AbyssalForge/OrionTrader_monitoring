<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaosd - Chaos Engineering Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .warning {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .experiments {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .experiments h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .experiment-item {
            background: #f5f5f5;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .experiment-info {
            flex: 1;
        }

        .experiment-info strong {
            color: #667eea;
        }

        .stop-btn {
            padding: 8px 15px;
            width: auto;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 5px;
            color: white;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .error {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .no-experiments {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Chaos Engineering Dashboard</h1>

        <div class="grid">
            <!-- Container Stop -->
            <div class="card">
                <h2>⏸️ Arrêter un conteneur</h2>
                <div class="input-group">
                    <label for="stop-container-id">Sélectionner un conteneur</label>
                    <select id="stop-container-id">
                        <option value="">Chargement...</option>
                    </select>
                </div>
                <button class="warning" onclick="containerStop()">Arrêter le conteneur</button>
            </div>
        </div>

        <!-- Experiments List -->
        <div class="experiments">
            <h2>🧪 Expériences en cours</h2>
            <div id="experiments-list">
                <div class="no-experiments">Aucune expérience en cours</div>
            </div>
        </div>
    </div>

    <script>
        function showMessage(message, type = 'success') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.textContent = message;
            document.body.appendChild(msgDiv);

            setTimeout(() => {
                msgDiv.remove();
            }, 3000);
        }

        async function loadContainers() {
            try {
                const response = await fetch('/api/containers');
                const containers = await response.json();

                const stopSelect = document.getElementById('stop-container-id');

                // Clear existing options
                stopSelect.innerHTML = '<option value="">-- Sélectionner un conteneur --</option>';

                // Add container options
                containers.forEach(container => {
                    // Afficher le nom du conteneur avec le réseau
                    const displayText = `${container.name} [${container.network_display}]`;

                    const option = document.createElement('option');
                    option.value = container.name;
                    option.textContent = displayText;
                    stopSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Erreur lors du chargement des conteneurs:', error);
            }
        }

        async function containerStop() {
            const containerId = document.getElementById('stop-container-id').value;

            if (!containerId) {
                showMessage('Veuillez sélectionner un conteneur', 'error');
                return;
            }

            try {
                const response = await fetch('/api/attack/container-stop', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ container_id: containerId })
                });

                const data = await response.json();
                if (response.ok) {
                    showMessage(`Conteneur ${containerId} arrêté avec succès`, 'success');
                    loadExperiments();
                } else {
                    showMessage(`Erreur: ${data.error || 'Échec de l\'arrêt'}`, 'error');
                }
            } catch (error) {
                showMessage(`Erreur: ${error.message}`, 'error');
            }
        }

        async function stopExperiment(uid) {
            try {
                const response = await fetch(`/api/recover/${uid}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showMessage('Expérience arrêtée avec succès', 'success');
                    loadExperiments();
                } else {
                    showMessage('Erreur lors de l\'arrêt de l\'expérience', 'error');
                }
            } catch (error) {
                showMessage(`Erreur: ${error.message}`, 'error');
            }
        }

        async function loadExperiments() {
            try {
                const response = await fetch('/api/experiments');
                const data = await response.json();

                const listDiv = document.getElementById('experiments-list');

                if (!data || data.length === 0) {
                    listDiv.innerHTML = '<div class="no-experiments">Aucune expérience en cours</div>';
                    return;
                }

                listDiv.innerHTML = data.map(exp => `
                    <div class="experiment-item">
                        <div class="experiment-info">
                            <strong>UID:</strong> ${exp.uid || 'N/A'}<br>
                            <strong>Type:</strong> ${exp.kind || 'N/A'}<br>
                            <strong>Status:</strong> ${exp.status || 'Running'}
                        </div>
                        <button class="stop-btn" onclick="stopExperiment('${exp.uid}')">Arrêter</button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erreur lors du chargement des expériences:', error);
            }
        }

        // Charger les conteneurs au démarrage
        loadContainers();

        // Charger les expériences toutes les 5 secondes
        loadExperiments();
        setInterval(loadExperiments, 5000);

        // Recharger la liste des conteneurs toutes les 10 secondes
        setInterval(loadContainers, 10000);
    </script>
</body>
</html>
