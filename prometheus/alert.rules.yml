groups:
  # C20 - Détection automatique d'incidents
  - name: service_availability
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job=~"Audiomancy_.*"} == 0
        for: 2m
        labels:
          severity: critical
          component: availability
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} at {{ $labels.instance }} has been down for more than 2 minutes."
          incident_type: "Service Unavailable"
          remediation: "1. Check container logs\n2. Verify network connectivity\n3. Check resource availability"

      - alert: HighErrorRate
        expr: rate(http_requests_total{job=~"Audiomancy_.*", status_code=~"5.."}[5m]) > 0.05
        for: 3m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.job }}"
          incident_type: "Application Error"
          remediation: "1. Check application logs\n2. Review recent deployments\n3. Check database connections"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=~"Audiomancy_.*"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "High latency on {{ $labels.job }}"
          description: "95th percentile latency is {{ $value }}s on {{ $labels.job }}"
          incident_type: "Performance Degradation"
          remediation: "1. Check database query performance\n2. Review application profiling\n3. Check external API latency"

  - name: resource_monitoring
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total{job=~"Audiomancy_.*"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          component: resources
        annotations:
          summary: "High CPU usage on {{ $labels.job }}"
          description: "CPU usage is {{ $value | humanizePercentage }} on {{ $labels.job }}"
          incident_type: "Resource Exhaustion"
          remediation: "1. Check for CPU-intensive operations\n2. Review recent code changes\n3. Consider scaling horizontally"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job=~"Audiomancy_.*"} / 1024 / 1024 / 1024 > 2
        for: 5m
        labels:
          severity: warning
          component: resources
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: "Memory usage is {{ $value }}GB on {{ $labels.job }}"
          incident_type: "Memory Leak Suspected"
          remediation: "1. Check for memory leaks\n2. Review object lifecycle\n3. Consider increasing memory limits"

  # C20 - Feedback loop MLOps (pour applications IA)
  - name: ml_model_monitoring
    interval: 60s
    rules:
      - alert: ModelPredictionLatencyHigh
        expr: histogram_quantile(0.95, rate(model_prediction_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          component: ml_model
        annotations:
          summary: "ML model prediction latency is high"
          description: "95th percentile prediction latency is {{ $value }}s"
          incident_type: "Model Performance"
          remediation: "1. Check model complexity\n2. Review input data size\n3. Consider model optimization or caching"

      - alert: ModelAccuracyDrop
        expr: model_accuracy < 0.85
        for: 10m
        labels:
          severity: critical
          component: ml_model
        annotations:
          summary: "ML model accuracy has dropped"
          description: "Model accuracy is {{ $value | humanizePercentage }}, below threshold of 85%"
          incident_type: "Model Drift Detected"
          remediation: "1. Check for data drift\n2. Verify input data quality\n3. Consider model retraining"

      - alert: HighModelErrorRate
        expr: rate(model_prediction_errors_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          component: ml_model
        annotations:
          summary: "High ML model error rate"
          description: "Model error rate is {{ $value | humanizePercentage }}"
          incident_type: "Model Errors"
          remediation: "1. Check input validation\n2. Review model version\n3. Verify dependencies"

  - name: security_monitoring
    interval: 30s
    rules:
      - alert: TooManyAuthenticationFailures
        expr: rate(authentication_failures_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "High authentication failure rate"
          description: "Authentication failure rate is {{ $value }} per second"
          incident_type: "Security Incident"
          remediation: "1. Check for brute force attacks\n2. Review IP addresses\n3. Consider implementing rate limiting"

  - name: data_privacy_compliance
    interval: 60s
    rules:
      - alert: PersonalDataAccessSpike
        expr: rate(personal_data_access_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          component: privacy
        annotations:
          summary: "Unusual spike in personal data access"
          description: "Personal data access rate is {{ $value }} per second"
          incident_type: "Privacy Compliance"
          remediation: "1. Verify legitimate access patterns\n2. Check for data breaches\n3. Review GDPR compliance logs"
