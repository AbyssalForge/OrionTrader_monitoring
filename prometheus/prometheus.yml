global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['10.8.0.1:9093']

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['10.8.0.1:9090']

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['10.8.0.1:9092']

  - job_name: 'grafana'
    static_configs:
      - targets: ['10.8.0.1:9091']

  - job_name: 'Audiomancy_backend'
    static_configs:
      - targets: ['10.8.0.1:8000']

  - job_name: 'Audiomancy_frontend'
    static_configs:
      - targets: ['10.8.0.1:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 15s

  - job_name: 'OrionTrader_fastapi'
    static_configs:
      - targets: ['10.8.0.1:8001']
    metrics_path: '/metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    scrape_interval: 15s
