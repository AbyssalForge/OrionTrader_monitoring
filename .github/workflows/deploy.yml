name: Deploy to OVH VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          WG_PASSWORD: ${{ secrets.WG_PASSWORD }}
        run: |
          ssh -p $VPS_PORT $VPS_USERNAME@$VPS_HOST << 'ENDSSH'
            # Définir le répertoire de l'application
            APP_DIR="$HOME/monitoring"

            # Créer le répertoire s'il n'existe pas
            mkdir -p $APP_DIR

            # Aller dans le répertoire
            cd $APP_DIR

            # Cloner ou mettre à jour le repository
            if [ -d ".git" ]; then
              echo "Mise à jour du repository..."
              git fetch --all
              git reset --hard origin/main
              git pull origin main
            else
              echo "Clonage du repository..."
              git clone https://github.com/${{ github.repository }} .
            fi

            # Arrêter les conteneurs existants
            echo "Arrêt des conteneurs..."
            sudo docker-compose down || true

            # Nettoyer les images non utilisées
            sudo docker system prune -f

            # Démarrer les conteneurs
            echo "Démarrage des conteneurs..."
            sudo docker-compose up -d --build

            # Afficher le status
            echo "Status des conteneurs:"
            sudo docker-compose ps
          ENDSSH

      - name: Verify Deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          ssh -p $VPS_PORT $VPS_USERNAME@$VPS_HOST << 'ENDSSH'
            cd $HOME/monitoring
            echo "=== Vérification des conteneurs ==="
            sudo docker-compose ps
            echo ""
            echo "=== Logs récents ==="
            sudo docker-compose logs --tail=50
          ENDSSH

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
